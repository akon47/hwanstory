# Hwan'Story 프론트 컨테이너 nginx 설정.
# 이 파일은 템플릿이다: 컨테이너가 시작될 때 공식 nginx 이미지가 ${PRERENDER_UPSTREAM} 만 환경변수 값으로 채워 /etc/nginx/conf.d/default.conf 로 만든다.
# (nginx 변수 $uri, $request_uri 등은 환경변수가 아니므로 그대로 남는다)
#
# 검색엔진 최적화(SEO) 구성:
#   - 사람은 SPA(index.html) 를 받는다.
#   - 검색엔진·SNS 미리보기·AI 크롤러가 "페이지 라우트" 를 요청하면 API 서버의 /prerender 가 만든 서버 렌더 HTML
#     (본문·메타·canonical·JSON-LD 포함, 없는 글은 404) 을 받는다. 예전처럼 VM 의 cron 이 /static 에 HTML 을 만들 필요가 없다.
#   - /sitemap.xml 과 /rss 는 API 서버가 요청 시점에 만든다 (항상 최신).

# 크롤러 판별 (대소문자 무시). Lighthouse 등 성능 측정 도구는 포함하지 않는다.
map $http_user_agent $hs_bot {
    default 0;
    "~*(googlebot|google-inspectiontool|adsbot-google|mediapartners-google|bingbot|bingpreview|yeti|naverbot|daum|kakao|facebookexternalhit|facebot|meta-externalagent|twitterbot|slackbot|discordbot|linkedinbot|telegrambot|whatsapp|applebot|duckduckbot|baiduspider|yandex|petalbot|ia_archiver|embedly|pinterest|skypeuripreview|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|anthropic-ai|perplexitybot|bytespider|semrushbot|ahrefsbot|mj12bot|redditbot|mastodon|bluesky|seznambot|sogou|360spider|coccoc|w3c_validator|outbrain|qwantify)" 1;
}

# 서버 렌더 대상 페이지 라우트 (정적 파일·그 밖의 SPA 화면 제외).
# 블로그 아래 경로는 전부 보낸다: 없는 글·엉뚱한 깊은 경로도 API 가 진짜 404 를 돌려주어 soft-404 가 생기지 않는다.
map $uri $hs_page {
    default 0;
    "~^/$" 1;
    "~^/(top|agents)$" 1;
    "~^/@[A-Za-z0-9_-]+(/.*)?$" 1;
}

map "$hs_bot:$hs_page" $hs_prerender {
    default 0;
    "1:1" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    # proxy_pass 에 변수를 쓰므로 실행 시점에 이름을 푸는 resolver 가 필요하다. (DNS 가 잠시 안 돼도 nginx 는 시작된다)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $hs_upstream "${PRERENDER_UPSTREAM}";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # 사이트맵·RSS: API 서버가 만든다 (별도 생성 스크립트 불필요)
    location = /sitemap.xml {
        proxy_pass $hs_upstream/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ignore_headers Cache-Control;
        expires 10m;
    }

    location ~ ^/rss(/.*)?$ {
        proxy_pass $hs_upstream$uri;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ignore_headers Cache-Control;
        expires 10m;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location ~* ^/(js|css|fonts|img)/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # 크롤러가 페이지 라우트를 요청하면 서버 렌더 HTML 로 (사람은 SPA)
        error_page 418 = @prerender;
        if ($hs_prerender) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @prerender {
        proxy_pass $hs_upstream/prerender$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # API 서버가 응답하지 못하면 SPA 를 그대로 준다 (404 등 정상 오류는 그대로 전달)
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
}
